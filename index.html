<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>근골격해부학 경시대회 시스템</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK 로드 -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f3f4f6; overflow-x: hidden; }
        .prevent-select { -webkit-user-select: none; -ms-user-select: none; user-select: none; }
        .pulse-red { animation: pulse 1s infinite; color: #ef4444; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyCrWqeneLO6Fm8iG8JOsoF3PMyTDSfFAFI",
            authDomain: "anatomy-test-2026.firebaseapp.com",
            projectId: "anatomy-test-2026",
            storageBucket: "anatomy-test-2026.firebasestorage.app",
            messagingSenderId: "815754593334",
            appId: "1:815754593334:web:e40d52c8ce7688cfa2c497",
            measurementId: "G-Y11P070B4X"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const QUESTIONS = [
            { id: 1, options: ["Calcaneal tuberosity", "Sustentaculum tali", "Navicular tuberosity", "Medial malleolus", "Lateral process of talus"], ans: 2 },
            { id: 2, options: ["Long plantar ligament", "Calcaneofibular ligament", "Short plantar ligament", "Spring ligament", "Anterior talofibular ligament"], ans: 4 },
            { id: 3, options: ["Posterior talofibular ligament", "Anterior tibiofibular ligament", "Anterior talofibular ligament", "Calcaneofibular ligament", "Posterior tibiofibular ligament"], ans: 4 },
            { id: 4, options: ["Anterior tibiofibular ligament", "Anterior talofibular ligament", "Calcaneofibular ligament", "Posterior tibiofibular ligament", "Posterior talofibular ligament"], ans: 1 },
            { id: 5, options: ["Head of the fifth metatarsal", "Navicular tuberosity", "Calcaneal tuberosity", "Tuberosity of the fifth metatarsal", "Base of the first metatarsal"], ans: 4 },
            { id: 6, options: ["Tibiocalcaneal ligament", "Tibiospring ligament", "Posterior tibiotalar ligament", "Tibionavicular ligament", "Anterior tibiotalar ligament"], ans: 2 },
            { id: 7, options: ["Adductor tubercle", "Medial epicondyle of femur", "Intercondylar eminence", "Lateral epicondyle of femur", "Tibial tuberosity"], ans: 1 },
            { id: 8, options: ["Iliotibial tract", "Patellar ligament", "Biceps femoris tendon", "Semimembranosus tendon", "Pes anserinus"], ans: 5 },
            { id: 9, options: ["Posterior cruciate ligament", "Transverse ligament of the knee", "Anterior meniscofemoral ligament", "Posterior meniscofemoral ligament", "Anterior cruciate ligament"], ans: 4 },
            { id: 10, options: ["Anterior cruciate ligament", "Transverse ligament of the knee", "Posterior meniscofemoral ligament", "Anterior meniscofemoral ligament", "Posterior cruciate ligament"], ans: 2 },
            { id: 11, options: ["Intercondylar fossa", "Popliteal surface", "Trochlear groove", "Medial femoral condyle", "Lateral femoral condyle"], ans: 3 },
            { id: 12, options: ["Semitendinosus", "Gracilis", "Biceps femoris", "Sartorius", "Semimembranosus"], ans: 1 },
            { id: 13, options: ["Alar ligament", "Anterior longitudinal ligament", "Apical ligament", "Ligamentum nuchae", "Transverse ligament of atlas"], ans: 5 },
            { id: 14, options: ["Interspinous ligament", "Posterior longitudinal ligament", "Intertransverse ligament", "Supraspinous ligament", "Ligamentum flavum"], ans: 5 },
            { id: 15, options: ["Supraspinous ligament", "Anterior longitudinal ligament", "Posterior longitudinal ligament", "Ligamentum flavum", "Interspinous ligament"], ans: 3 },
            { id: 16, options: ["Intertransverse ligament", "Interspinous ligament", "Ligamentum flavum", "Supraspinous ligament", "Posterior longitudinal ligament"], ans: 2 },
            { id: 17, options: ["Pedicle", "Lamina", "Superior articular process", "Transverse process", "Spinous process"], ans: 1 },
            { id: 18, options: ["Transverse costal facet", "Inferior articular facet", "Superior articular facet", "Inferior costal facet", "Superior costal facet"], ans: 2 },
            { id: 19, options: ["Radial collateral ligament", "Posterior bundle of the ulnar collateral ligament", "Lateral ulnar collateral ligament", "Anterior bundle of ulnar collateral ligament", "Transverse bundle of the ulnar collateral ligament"], ans: 4 },
            { id: 20, options: ["Coracoacromial ligament", "Coracoclavicular ligament", "Superior glenohumeral ligament", "Acromioclavicular ligament", "Coracohumeral ligament"], ans: 2 },
            { id: 21, options: ["Anatomical neck of humerus", "Lesser tubercle", "Neck of humerus", "Intertubercular groove", "Greater tubercle"], ans: 4 },
            { id: 22, options: ["Teres major", "Supraspinatus", "Infraspinatus", "Teres minor", "Subscapularis"], ans: 5 },
            { id: 23, options: ["Infraspinatus", "Teres minor", "Teres major", "Subscapularis", "Supraspinatus"], ans: 2 },
            { id: 24, options: ["Levator scapulae", "Rhomboid minor", "Serratus posterior superior", "Rhomboid major", "Middle trapezius"], ans: 2 },
            { id: 25, options: ["Trochlea of humerus", "Radial head", "Lateral epicondyle of humerus", "Capitulum", "Coronoid process of ulna"], ans: 4 },
            { id: 26, options: ["Coronoid fossa", "Radial fossa", "Olecranon fossa", "Radial notch of ulna", "Trochlear notch"], ans: 1 },
            { id: 27, options: ["Quadrate ligament", "Radial collateral ligament", "Lateral ulnar collateral ligament", "Oblique cord", "Annular ligament of radius"], ans: 5 },
            { id: 28, options: ["Annular ligament of radius", "Lateral ulnar collateral ligament", "Anterior bundle of the ulnar collateral ligament", "Radial collateral ligament", "Posterior bundle of the ulnar collateral ligament"], ans: 2 },
            { id: 29, options: ["Brachialis", "Brachioradialis", "Coracobrachialis", "Pronator teres", "Biceps brachii"], ans: 1 },
            { id: 30, options: ["Flexor pollicis longus", "Supinator", "Flexor digitorum profundus", "Pronator quadratus", "Pronator teres"], ans: 4 }
        ];

        // --- 교수용 뷰 컴포넌트 ---
        const AdminView = ({ onBack }) => {
            const [roomCode, setRoomCode] = useState('');
            const [students, setStudents] = useState({});
            const [stateData, setStateData] = useState({ status: 'IDLE', qIndex: 0, timer: 0 });
            const timerRef = useRef(null);

            useEffect(() => {
                const code = Math.random().toString(36).substring(2, 6).toUpperCase();
                setRoomCode(code);
                
                // 방 생성 및 상태 초기화
                db.ref(`rooms/${code}/state`).set({ status: 'IDLE', qIndex: 0, timer: 0 });
                
                // 학생 데이터 리스너
                const studentsRef = db.ref(`rooms/${code}/students`);
                studentsRef.on('value', (snap) => {
                    setStudents(snap.val() || {});
                });

                // 관리자 UI 렌더링용 상태 리스너
                const stateRef = db.ref(`rooms/${code}/state`);
                stateRef.on('value', (snap) => {
                    if (snap.val()) setStateData(snap.val());
                });

                return () => {
                    if (timerRef.current) clearInterval(timerRef.current);
                    studentsRef.off();
                    stateRef.off();
                };
            }, []);

            const startQuestion = () => {
                let timeLeft = 3;
                let currentPhase = 'PREP';
                const qIdx = stateData.qIndex;
                
                db.ref(`rooms/${roomCode}/state`).update({ status: 'PREP', qIndex: qIdx, timer: timeLeft });

                timerRef.current = setInterval(() => {
                    timeLeft -= 1;
                    if (timeLeft > 0) {
                        db.ref(`rooms/${roomCode}/state/timer`).set(timeLeft);
                    } else {
                        if (currentPhase === 'PREP') {
                            timeLeft = 10;
                            currentPhase = 'ACTIVE';
                            db.ref(`rooms/${roomCode}/state`).update({ status: 'ACTIVE', timer: timeLeft });
                        } else if (currentPhase === 'ACTIVE') {
                            clearInterval(timerRef.current);
                            currentPhase = 'RESULT';
                            db.ref(`rooms/${roomCode}/state`).update({ status: 'RESULT', timer: 0 });
                        }
                    }
                }, 1000);
            };

            const nextQuestion = () => {
                if (stateData.qIndex < QUESTIONS.length - 1) {
                    db.ref(`rooms/${roomCode}/state`).update({ 
                        status: 'IDLE', 
                        qIndex: stateData.qIndex + 1, 
                        timer: 0 
                    });
                }
            };

            const exportCSV = () => {
                let csvContent = "\uFEFF"; 
                let headers = ["학번", "이름", "점수"];
                for (let i = 1; i <= QUESTIONS.length; i++) headers.push(`${i}번`);
                csvContent += headers.join(",") + "\n";

                Object.keys(students).forEach(studentId => {
                    const student = students[studentId];
                    let score = 0;
                    let row = [studentId, student.name];
                    let answersRow = [];

                    QUESTIONS.forEach((q, index) => {
                        const ans = student.answers ? student.answers[index] : null;
                        if (ans === q.ans) score++;
                        answersRow.push(ans ? ans : ""); 
                    });

                    row.push(score);
                    row = row.concat(answersRow);
                    csvContent += row.join(",") + "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", "해부학경시대회_결과.csv");
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const curQ = QUESTIONS[stateData.qIndex];
            const studentIds = Object.keys(students);
            const totalStudents = studentIds.length;
            
            const submittedCount = studentIds.filter(id => students[id].answers && students[id].answers[stateData.qIndex]).length;
            const correctCount = studentIds.filter(id => students[id].answers && students[id].answers[stateData.qIndex] === curQ.ans).length;
            const wrongCount = submittedCount - correctCount;

            return (
                <div className="max-w-4xl mx-auto p-6">
                    <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
                        <div className="flex justify-between items-center border-b pb-4 mb-4">
                            <div>
                                <h1 className="text-2xl font-bold text-gray-800">해부학 경시대회 LIVE CONTROL</h1>
                                <p className="text-gray-500 mt-1">학생들에게 아래 참가 코드를 공유하세요.</p>
                            </div>
                            <div className="flex gap-4">
                                <button onClick={exportCSV} className="bg-green-600 hover:bg-green-700 text-white px-4 py-3 rounded-lg font-bold shadow transition-colors flex items-center h-full">
                                    CSV 다운로드
                                </button>
                                <div className="bg-indigo-600 text-white px-6 py-3 rounded-lg text-center">
                                    <p className="text-xs font-semibold opacity-80">참가 코드</p>
                                    <p className="text-3xl font-mono tracking-widest font-bold">{roomCode}</p>
                                </div>
                            </div>
                        </div>

                        <div className="flex justify-between mb-4">
                            <span className="bg-gray-100 text-gray-700 px-4 py-2 rounded-full font-semibold">
                                현재 접속자: {totalStudents}명
                            </span>
                            <span className="bg-gray-100 text-gray-700 px-4 py-2 rounded-full font-semibold">
                                진행: {stateData.qIndex + 1} / {QUESTIONS.length}
                            </span>
                        </div>

                        <div className="bg-blue-50 border border-blue-200 rounded-lg p-6 my-6">
                            <div className="flex justify-between items-start">
                                <div>
                                    <h2 className="text-xl font-bold text-blue-900 mb-4">{stateData.qIndex + 1}번 문항 (정답: {curQ.ans}번)</h2>
                                    <ul className="space-y-2">
                                        {curQ.options.map((opt, i) => (
                                            <li key={i} className={`flex items-center p-2 rounded ${i+1 === curQ.ans ? 'bg-green-100 font-bold text-green-800' : 'text-gray-700'}`}>
                                                <span className="w-6 h-6 inline-flex items-center justify-center rounded-full bg-white border border-gray-300 mr-3 text-sm">{i+1}</span>
                                                {opt}
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                                
                                <div className="text-center min-w-[150px]">
                                    {stateData.status === 'IDLE' && (
                                        <button onClick={startQuestion} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl shadow-md transition-all text-lg">
                                            {stateData.qIndex + 1}번 문항 시작
                                        </button>
                                    )}
                                    {stateData.status === 'PREP' && (
                                        <div className="bg-yellow-100 text-yellow-800 p-4 rounded-xl border border-yellow-300">
                                            <p className="text-sm font-bold mb-1">준비 시간</p>
                                            <p className="text-5xl font-black">{stateData.timer}</p>
                                        </div>
                                    )}
                                    {stateData.status === 'ACTIVE' && (
                                        <div className="bg-red-100 text-red-800 p-4 rounded-xl border border-red-300">
                                            <p className="text-sm font-bold mb-1">응답 진행 중!</p>
                                            <p className="text-5xl font-black pulse-red">{stateData.timer}</p>
                                            <p className="text-xs mt-2 font-semibold">제출: {submittedCount}/{totalStudents}</p>
                                        </div>
                                    )}
                                    {stateData.status === 'RESULT' && (
                                        <div className="flex flex-col gap-3">
                                            <div className="bg-gray-100 text-gray-800 p-4 rounded-xl">
                                                <p className="font-bold mb-2 text-sm">제출 결과</p>
                                                <div className="text-left text-sm space-y-1">
                                                    <p className="text-green-600 font-bold">정답: {correctCount}명</p>
                                                    <p className="text-red-500 font-semibold">오답: {wrongCount}명</p>
                                                    <p className="text-gray-500">미제출: {totalStudents - submittedCount}명</p>
                                                </div>
                                            </div>
                                            <button onClick={nextQuestion} disabled={stateData.qIndex >= QUESTIONS.length - 1} className="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-4 rounded-lg disabled:opacity-50">
                                                다음 문항으로
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <button onClick={onBack} className="text-gray-500 hover:text-gray-800 underline text-sm">
                        초기 화면으로 돌아가기 (주의: 방 상태는 유지되나 연결은 해제됨)
                    </button>
                </div>
            );
        };

        // --- 학생용 뷰 컴포넌트 ---
        const StudentView = ({ onBack }) => {
            const [joined, setJoined] = useState(false);
            const [roomCode, setRoomCode] = useState('');
            const [studentId, setStudentId] = useState('');
            const [name, setName] = useState('');
            const [error, setError] = useState('');

            const [stateData, setStateData] = useState({ status: 'IDLE', qIndex: 0, timer: 0 });
            const [myAnswers, setMyAnswers] = useState({});

            const handleJoin = async (e) => {
                e.preventDefault();
                if (!roomCode || !studentId || !name) {
                    setError('코드를 포함한 모든 정보를 입력해주세요.'); return;
                }
                
                const upperCode = roomCode.toUpperCase();
                const roomRef = db.ref(`rooms/${upperCode}`);
                
                const snapshot = await roomRef.once('value');
                if (!snapshot.exists()) {
                    setError('존재하지 않거나 만료된 참가 코드입니다.');
                    return;
                }

                // 학생 정보 등록
                await db.ref(`rooms/${upperCode}/students/${studentId}`).update({ name: name });
                setJoined(true);

                // 서버 상태 동기화 리스너
                db.ref(`rooms/${upperCode}/state`).on('value', (snap) => {
                    if (snap.val()) setStateData(snap.val());
                });

                // 내 답안 동기화 리스너
                db.ref(`rooms/${upperCode}/students/${studentId}/answers`).on('value', (snap) => {
                    setMyAnswers(snap.val() || {});
                });
            };

            const submitAnswer = (ans) => {
                if (stateData.status !== 'ACTIVE') return;
                db.ref(`rooms/${roomCode.toUpperCase()}/students/${studentId}/answers/${stateData.qIndex}`).set(ans);
            };

            if (!joined) {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
                            <h1 className="text-2xl font-bold text-center text-gray-800 mb-6">학생용 접속</h1>
                            <form onSubmit={handleJoin} className="space-y-4">
                                <div>
                                    <label className="block text-gray-700 text-sm font-bold mb-2">교수님 화면의 참가 코드</label>
                                    <input type="text" value={roomCode} onChange={e => setRoomCode(e.target.value)} 
                                           className="w-full px-4 py-3 rounded-lg border focus:outline-none focus:ring-2 focus:ring-blue-500 uppercase font-mono" 
                                           placeholder="예: ABCD" maxLength="4" />
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-gray-700 text-sm font-bold mb-2">학번</label>
                                        <input type="text" value={studentId} onChange={e => setStudentId(e.target.value)} 
                                               className="w-full px-4 py-3 rounded-lg border focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                               placeholder="예: 20260001" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-700 text-sm font-bold mb-2">이름</label>
                                        <input type="text" value={name} onChange={e => setName(e.target.value)} 
                                               className="w-full px-4 py-3 rounded-lg border focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                               placeholder="홍길동" />
                                    </div>
                                </div>
                                {error && <p className="text-red-500 text-sm font-semibold">{error}</p>}
                                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors mt-2">
                                    입장하기
                                </button>
                            </form>
                            <div className="mt-4 text-center">
                                <button onClick={onBack} className="text-gray-400 text-sm underline">뒤로가기</button>
                            </div>
                        </div>
                    </div>
                );
            }

            const curQ = QUESTIONS[stateData.qIndex];
            const currentMyAnswer = myAnswers[stateData.qIndex] || null;

            return (
                <div className="min-h-screen flex flex-col p-4 bg-gray-50 prevent-select">
                    <div className="flex justify-between items-center mb-6">
                        <span className="bg-blue-100 text-blue-800 text-sm font-bold px-3 py-1 rounded-full">{studentId} {name}</span>
                        <span className="text-gray-500 font-semibold text-sm">문항 {stateData.qIndex + 1} / 30</span>
                    </div>

                    <div className="flex-grow flex flex-col justify-center max-w-lg mx-auto w-full">
                        {stateData.status === 'IDLE' && (
                            <div className="text-center p-8 bg-white rounded-2xl shadow-sm border">
                                <div className="text-6xl mb-4">👀</div>
                                <h2 className="text-xl font-bold text-gray-700">교수님을 기다리고 있습니다.</h2>
                                <p className="text-gray-500 mt-2 text-sm">PPT를 보고 준비해주세요.</p>
                            </div>
                        )}

                        {stateData.status === 'PREP' && (
                            <div className="text-center p-8 bg-yellow-50 rounded-2xl border border-yellow-200">
                                <h2 className="text-2xl font-bold text-yellow-800 mb-2">준비하세요!</h2>
                                <p className="text-gray-600 mb-4">곧 보기가 표시됩니다.</p>
                                <div className="text-8xl font-black text-yellow-600">{stateData.timer}</div>
                            </div>
                        )}

                        {stateData.status === 'ACTIVE' && (
                            <div className="flex flex-col h-full">
                                <div className="text-center mb-6">
                                    <div className="inline-block bg-red-100 text-red-600 text-5xl font-black px-8 py-4 rounded-2xl shadow-inner pulse-red">
                                        {stateData.timer}
                                    </div>
                                </div>
                                <div className="space-y-3">
                                    {curQ.options.map((opt, i) => {
                                        const isSelected = currentMyAnswer === i + 1;
                                        return (
                                            <button 
                                                key={i}
                                                onClick={() => submitAnswer(i + 1)}
                                                className={`w-full text-left p-4 rounded-xl border-2 transition-all flex items-center
                                                    ${isSelected ? 'bg-blue-600 border-blue-600 text-white shadow-md' : 'bg-white border-gray-200 text-gray-800 hover:border-blue-400 active:bg-blue-50'}
                                                `}
                                            >
                                                <span className={`w-8 h-8 inline-flex items-center justify-center rounded-full mr-4 font-bold text-sm
                                                    ${isSelected ? 'bg-white text-blue-600' : 'bg-gray-100 text-gray-500'}
                                                `}>
                                                    {i + 1}
                                                </span>
                                                <span className="font-semibold text-lg">{opt}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                                {currentMyAnswer !== null && (
                                    <div className="mt-6 text-center text-blue-600 font-bold">
                                        ✓ {currentMyAnswer}번 선택됨 (남은 시간 내 변경 가능)
                                    </div>
                                )}
                            </div>
                        )}

                        {stateData.status === 'RESULT' && (
                            <div className="text-center p-8 bg-gray-100 rounded-2xl border">
                                <div className="text-4xl mb-4">⏳</div>
                                <h2 className="text-xl font-bold text-gray-700">문항이 종료되었습니다.</h2>
                                <p className="text-gray-500 mt-2">교수님이 다음 문항을 시작할 때까지 대기하세요.</p>
                                {currentMyAnswer !== null ? (
                                    <div className="mt-4 inline-block bg-white px-4 py-2 rounded-lg text-sm text-gray-600 border">
                                        최종 선택 답: <span className="font-bold text-gray-800">{currentMyAnswer}번</span>
                                    </div>
                                ) : (
                                    <div className="mt-4 text-red-500 font-bold text-sm">
                                        시간 초과로 미제출 되었습니다.
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [role, setRole] = useState(null);
            const [adminAuth, setAdminAuth] = useState(false);
            const [pwdInput, setPwdInput] = useState('');
            const [pwdError, setPwdError] = useState('');

            // 관리자 인증 비밀번호 설정
            const ADMIN_PASSWORD = "0625";

            const handleAdminLogin = () => {
                if (pwdInput === ADMIN_PASSWORD) {
                    setAdminAuth(true);
                    setPwdError('');
                } else {
                    setPwdError('비밀번호가 일치하지 않습니다.');
                }
            };

            if (role === 'admin' && !adminAuth) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50 p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full text-center">
                            <h2 className="text-2xl font-bold text-gray-800 mb-6">교수용 관리자 인증</h2>
                            <input 
                                type="password" 
                                value={pwdInput}
                                onChange={(e) => setPwdInput(e.target.value)}
                                onKeyDown={(e) => { if (e.key === 'Enter') handleAdminLogin(); }}
                                className="w-full border-2 border-gray-300 focus:border-indigo-500 focus:outline-none p-3 rounded-lg mb-2 text-center text-xl tracking-widest"
                                placeholder="비밀번호"
                                autoFocus
                            />
                            <div className="h-6 mb-4">
                                {pwdError && <p className="text-red-500 text-sm font-semibold">{pwdError}</p>}
                            </div>
                            <div className="flex gap-3">
                                <button onClick={() => { setRole(null); setPwdInput(''); setPwdError(''); }} className="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 py-3 rounded-lg font-bold transition-colors">취소</button>
                                <button onClick={handleAdminLogin} className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-lg font-bold transition-colors">확인</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (role === 'admin' && adminAuth) return <AdminView onBack={() => { setRole(null); setAdminAuth(false); setPwdInput(''); }} />;
            if (role === 'student') return <StudentView onBack={() => setRole(null)} />;

            return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
                    <div className="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden">
                        <div className="bg-indigo-600 p-8 text-center">
                            <h1 className="text-3xl font-black text-white mb-2">해부학 경시대회</h1>
                            <p className="text-indigo-200">10초 응답 클라우드 서버 시스템</p>
                        </div>
                        <div className="p-8 space-y-4">
                            <button 
                                onClick={() => setRole('admin')}
                                className="w-full flex items-center justify-center gap-3 bg-white border-2 border-indigo-600 text-indigo-700 hover:bg-indigo-50 font-bold py-4 px-6 rounded-xl transition-colors">
                                <span className="text-2xl">👨‍🏫</span>
                                <span>교수용 (관리자 시작)</span>
                            </button>
                            <button 
                                onClick={() => setRole('student')}
                                className="w-full flex items-center justify-center gap-3 bg-indigo-600 text-white hover:bg-indigo-700 font-bold py-4 px-6 rounded-xl shadow-md transition-colors">
                                <span className="text-2xl">🧑‍🎓</span>
                                <span>학생용 (대회 참가)</span>
                            </button>
                        </div>
                        <div className="bg-gray-50 p-4 text-center text-xs text-gray-500 border-t">
                            본 페이지는 Firebase 서버를 통해 안정적으로 실시간 동기화됩니다.<br/>새로고침을 해도 데이터가 안전하게 유지됩니다.
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
